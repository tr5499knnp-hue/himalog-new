<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;color:#202024;background:linear-gradient(180deg,#fafaff 0%,#ededf4 100%);min-height:100vh}
button{font:inherit;border:0}
.app{max-width:520px;margin:auto;padding:22px 16px 80px}
.header{padding:18px 10px 20px}
.logo{font-size:42px;line-height:1;margin-bottom:10px;animation:float 3s ease-in-out infinite}
.title{font-size:39px;font-weight:850;letter-spacing:-1.8px}
.subtitle{margin-top:7px;color:#7b7b83;font-size:14px}
.mission{position:relative;overflow:hidden;background:#202024;color:#fff;border-radius:27px;padding:23px;margin-bottom:17px;box-shadow:0 14px 35px rgba(0,0,0,.16)}
.mission:after{content:"";position:absolute;width:130px;height:130px;border-radius:50%;right:-45px;top:-55px;background:rgba(255,255,255,.06)}
.mission-label{font-size:12px;letter-spacing:1.4px;opacity:.58;margin-bottom:8px}
.mission-text{font-size:20px;font-weight:750;line-height:1.48;position:relative;z-index:1}
.mission-button{margin-top:15px;border-radius:14px;padding:11px 15px;background:rgba(255,255,255,.13);color:#fff;font-size:14px;position:relative;z-index:1}
.card{background:rgba(255,255,255,.96);border-radius:25px;padding:21px;margin-bottom:14px;box-shadow:0 7px 24px rgba(0,0,0,.055)}
.question{font-size:18px;font-weight:800;margin-bottom:14px}
.options{display:flex;flex-wrap:wrap;gap:9px}
.option{border-radius:15px;padding:13px 16px;background:#f0f0f3;color:#333;font-size:15px;transition:transform .16s,background .2s,color .2s,box-shadow .2s}
.option:active{transform:scale(.95)}
.option.selected{background:#202024;color:#fff;box-shadow:0 5px 12px rgba(0,0,0,.14)}
.search{width:100%;border-radius:19px;padding:18px;background:#202024;color:#fff;font-size:17px;font-weight:800;box-shadow:0 12px 28px rgba(0,0,0,.16);transition:transform .15s}
.search:active{transform:scale(.98)}
.result{display:none;margin-top:17px;background:#fff;border-radius:26px;padding:21px;box-shadow:0 8px 28px rgba(0,0,0,.07);animation:rise .35s ease}
.result-title{font-size:22px;font-weight:800;margin-bottom:4px}
.result-subtitle{color:#85858d;font-size:13px;margin-bottom:15px}
.activity{display:flex;align-items:center;gap:11px;background:#f5f5f7;border-radius:18px;padding:15px;margin-bottom:9px;transition:transform .15s}
.activity:active{transform:scale(.985)}
.activity-main{flex:1;min-width:0}
.activity-name{font-size:16px;font-weight:700;line-height:1.4}
.reason{font-size:12px;color:#888;margin-top:4px;line-height:1.35}
.heart{flex-shrink:0;width:43px;height:43px;border-radius:50%;background:#fff;font-size:23px;box-shadow:0 2px 8px rgba(0,0,0,.06);transition:transform .2s,color .2s}
.heart:active{transform:scale(.82)}
.heart.active{color:#ff3158;animation:pop .25s ease}
.another{width:100%;border-radius:15px;padding:14px;margin-top:4px;background:#ededf0;font-size:15px;font-weight:700}
.menu{display:flex;gap:10px;margin-top:15px}
.menu-button{flex:1;border-radius:17px;padding:15px 5px;background:#fff;color:#222;font-size:14px;font-weight:700;box-shadow:0 4px 15px rgba(0,0,0,.04);transition:transform .15s}
.menu-button:active{transform:scale(.97)}
.modal{display:none;position:fixed;z-index:100;inset:0;background:rgba(0,0,0,.42)}
.modal-box{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:520px;max-height:80vh;overflow-y:auto;background:#fff;border-radius:29px 29px 0 0;padding:24px 20px 30px;animation:sheet .28s ease}
.modal-title{font-size:23px;font-weight:850;margin-bottom:18px}
.close{width:100%;border-radius:15px;padding:14px;margin-top:17px;background:#202024;color:#fff;font-size:16px}
.favorite-row{display:flex;align-items:center;gap:10px;background:#f5f5f7;border-radius:15px;padding:14px;margin-bottom:9px}
.favorite-name{flex:1;font-size:15px}
.delete{border-radius:10px;padding:8px 10px;background:#fff;font-size:13px}
.history-date{font-weight:800;margin:17px 0 8px}
.history-item{background:#f5f5f7;border-radius:14px;padding:13px;margin-bottom:7px;font-size:14px;line-height:1.55}
.empty{text-align:center;color:#888;padding:30px 0}
.clear-history{width:100%;border-radius:14px;padding:13px;margin-top:10px;background:#eeeef1;font-size:14px}
.toast{position:fixed;left:50%;bottom:25px;transform:translateX(-50%) translateY(20px);background:#202024;color:#fff;padding:12px 17px;border-radius:14px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:200;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes sheet{from{transform:translate(-50%,100%)}to{transform:translate(-50%,0)}}
@keyframes pop{50%{transform:scale(1.25)}}
@keyframes float{50%{transform:translateY(-4px)}}
</style>

const reasonMap={
time:{tiny:"5〜10分でできる",short:"短時間でできる",middle:"ちょうどいい時間",long:"しっかり楽しめる",huge:"じっくり楽しめる",day:"半日〜1日楽しめる"},
money:{free:"お金をかけない",under500:"500円以内で楽しめる",little:"少しだけ使える",more:"予算を使って楽しめる",rich:"しっかり予算を使える"},

mood:{energetic:"今の元気を活かせる",bored:"退屈を変えられる",tired:"無理なくできる",change:"気分転換になる",creative:"新しいことを楽しめる",calm:"ゆっくり過ごせる",social:"誰かと話して楽しめる",learn:"知る楽しさを味わえる"},
place:{home:"家でできる",school:"学校・駅周辺向き",outside:"外にいる今に合う",transit:"移動中にできる",cafe:"カフェ・お店でできる",park:"公園でできる"}
};

function getFavorites(){return JSON.parse(localStorage.getItem("favorites")||"[]")}

function toggleFavorite(text,button){
 let favorites=getFavorites(),index=favorites.indexOf(text);
 if(index===-1){favorites.push(text);button.innerText="♥";button.classList.add("active");showToast("❤️ お気に入りに追加しました")}
 else{favorites.splice(index,1);button.innerText="♡";button.classList.remove("active");showToast("お気に入りから削除しました")}
 localStorage.setItem("favorites",JSON.stringify(favorites));
}

function findActivity(){
 for(const key of Object.keys(selections)){
  if(!selections[key]){showToast("全部の項目を選んでみて！");return}
 }
 let scored=activities.map(a=>{
  let score=0,matches=[];
  for(const key of Object.keys(selections)){
   if(a[key]===selections[key]){score+=(key==="people"||key==="place"?4:key==="time"||key==="mood"?3:2);matches.push(reasonMap[key][selections[key]])}
  }
  return {activity:a,score,matches};
 });
 scored.sort((a,b)=>b.score-a.score);
 const best=scored[0].score;
 let pool=scored.filter(x=>x.score>=best-4).sort((a,b)=>b.score-a.score || Math.random()-.5).slice(0,6);
 if(pool.length<3){
   pool=scored.sort((a,b)=>b.score-a.score || Math.random()-.5).slice(0,6);
 }
 displayActivities(pool);
 saveHistory(pool.map(x=>x.activity.text));
 document.getElementById("result").style.display="block";
 document.getElementById("resultSubtitle").innerText=`「${selections.people==="alone"?"一人":selections.people==="friend"?"友達と":"家族と"}」「${selections.mood==="energetic"?"元気":selections.mood==="bored"?"暇":selections.mood==="tired"?"疲れた":"気分転換したい"}」な今に合わせて選んだよ。`;
 document.getElementById("result").scrollIntoView({behavior:"smooth",block:"start"});
}

function displayActivities(items){
 const favorites=getFavorites();
 document.getElementById("activities").innerHTML=items.map(item=>{
  const text=item.activity.text,active=favorites.includes(text);
  const reasons=item.matches.slice(0,2).join("・");
  return `<div class="activity">
   <div class="activity-main"><div class="activity-name">${text}</div><div class="reason">✓ ${reasons}</div></div>
   <button class="heart ${active?"active":""}" onclick="toggleFavorite('${escapeText(text)}',this)">${active?"♥":"♡"}</button>
  </div>`;
 }).join("");
}

function escapeText(text){return text.replace(/\\/g,"\\\\").replace(/'/g,"\\'")}

function saveHistory(items){
 let history=JSON.parse(localStorage.getItem("history")||"[]");
 history.unshift({date:new Date().toISOString(),items});
 localStorage.setItem("history",JSON.stringify(history.slice(0,50)));
}

function showFavorites(){
 const favorites=getFavorites();
 document.getElementById("modalTitle").innerText="❤️ お気に入り";
 document.getElementById("modalBody").innerHTML=favorites.length?favorites.map((text,i)=>`<div class="favorite-row"><div class="favorite-name">${text}</div><button class="delete" onclick="deleteFavorite(${i})">🗑️ 削除</button></div>`).join(""):`<div class="empty">まだお気に入りがないよ。<br>気になったものの♡を押してみて！</div>`;
 document.getElementById("modal").style.display="block";
}
function deleteFavorite(index){let f=getFavorites();f.splice(index,1);localStorage.setItem("favorites",JSON.stringify(f));showFavorites();showToast("お気に入りから削除しました")}

function showHistory(){
 const history=JSON.parse(localStorage.getItem("history")||"[]");
 document.getElementById("modalTitle").innerText="📊 履歴";
 if(!history.length){document.getElementById("modalBody").innerHTML=`<div class="empty">まだ履歴がないよ。<br>暇つぶしを探すとここに残るよ！</div>`}
 else{
  let groups={};
  history.forEach(r=>{
   const d=new Date(r.date),today=new Date(),y=new Date();y.setDate(y.getDate()-1);
   let label=d.toDateString()===today.toDateString()?"今日":d.toDateString()===y.toDateString()?"昨日":d.toLocaleDateString("ja-JP",{month:"long",day:"numeric"});
   (groups[label]??=[]).push(r);
  });
  let html="";
  Object.keys(groups).forEach(label=>{
   html+=`<div class="history-date">${label}</div>`;
   groups[label].forEach(r=>{
    const t=new Date(r.date).toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"});
    html+=`<div class="history-item"><strong>${t}</strong><br>${r.items.join("<br>")}</div>`;
   });
  });
  html+=`<button class="clear-history" onclick="clearHistory()">🗑️ 履歴をすべて削除</button>`;
  document.getElementById("modalBody").innerHTML=html;
 }
 document.getElementById("modal").style.display="block";
}
function clearHistory(){localStorage.removeItem("history");showHistory();showToast("履歴を削除しました")}
function closeModal(){document.getElementById("modal").style.display="none"}
function showToast(message){const t=document.getElementById("toast");t.innerText=message;t.classList.add("show");clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.remove("show"),1800)}
document.getElementById("modal").addEventListener("click",e=>{if(e.target===e.currentTarget)closeModal()});
</script>
